[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tai"
version = "0.1.0"
description = "CLI for using every model installed on a Tiiny pocket AI device over Wi-Fi"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13",
    "textual>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "aihealth @ git+https://github.com/epatel/ai-health@v0.2.1",
]

[project.scripts]
tai = "tai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
