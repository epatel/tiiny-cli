name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch new releases inside the dependency ranges
  workflow_dispatch:

# actions are pinned to commit SHAs (a moved tag can't change what runs);
# Dependabot (.github/dependabot.yml) proposes updates
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest  # where tai is mostly used
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # aihealth (in the dev extras) needs Python 3.11+, so 3.10 gets the test tools only
      - name: Install
        run: |
          if [ "${{ matrix.python }}" = "3.10" ]; then
            python -m pip install -e . pytest respx
          else
            python -m pip install -e '.[dev]'
          fi
      - name: Test
        run: pytest -q
      - name: Code health
        if: matrix.python != '3.10'
        run: aihealth scan . --fail-under 9
